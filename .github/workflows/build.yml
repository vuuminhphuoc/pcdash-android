name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # A change to text only does not need a build (a tag push always does).
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # Kept inside the workspace so actions/cache can keep them between runs: the Tailscale code that
  # pcnet pulls in takes minutes to compile from nothing and seconds from the cache.
  GOCACHE: ${{ github.workspace }}\.cache\go-build
  GOMODCACHE: ${{ github.workspace }}\.cache\go-mod

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      NDK_VERSION: 27.1.12297006
      GO_VERSION: 1.27.1
      # Release signing. Without these secrets the build signs with a throwaway key,
      # which is fine for testing but cannot update an installed release.
      HAS_SIGNING_KEYS: ${{ secrets.PCDASH_HOST_KEYSTORE_B64 != '' && secrets.PCDASH_REMOTE_KEYSTORE_B64 != '' }}
      PCDASH_KEYSTORE_PASSWORD: ${{ secrets.PCDASH_KEYSTORE_PASSWORD }}
      # Stamped into PcAgent.exe so it can tell when a newer release exists. Other builds stay 0.0.0, which never updates itself.
      PCAGENT_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use JDK 17 for the build scripts
        run: Add-Content $env:GITHUB_ENV "PCDASH_JAVA_HOME=$env:JAVA_HOME"

      # Caches the Gradle distribution and dependencies between runs.
      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          ("y`n" * 20) | & $sdkmanager --licenses | Out-Null
          & $sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;$env:NDK_VERSION" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed" }

      - name: Install Go
        run: ./scripts/install-go-toolchain.ps1 -Version $env:GO_VERSION

      - uses: actions/cache@v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('pcnet/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Restore release signing keys
        if: env.HAS_SIGNING_KEYS == 'true'
        env:
          HOST_KEYSTORE: ${{ secrets.PCDASH_HOST_KEYSTORE_B64 }}
          REMOTE_KEYSTORE: ${{ secrets.PCDASH_REMOTE_KEYSTORE_B64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\app\pcdash.keystore", [Convert]::FromBase64String($env:HOST_KEYSTORE))
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\remote\pcdash-remote.keystore", [Convert]::FromBase64String($env:REMOTE_KEYSTORE))

      - name: Build host and remote APKs
        run: ./build-all.ps1

      - name: Build PcAgent
        run: ./agent/build_agent.ps1 -Out "$env:GITHUB_WORKSPACE\agent\build\" -WithHelper

      - name: Tests
        run: |
          $tests = @(
            'test-build-toolchain', 'lint-ui-thread', 'lint-l10n',
            'test-host-api', 'test-host-pairing', 'test-host-ui-model', 'test-host-update',
            'test-host-metrics', 'test-host-log-history', 'test-host-provisioning', 'test-host-quota', 'test-host-pcs',
            'test-remote-java', 'test-pairing-e2e', 'test-qr-roundtrip', 'test-agent-metrics'
          )
          $failed = @()
          foreach ($t in $tests) {
            Write-Host "::group::$t"
            & pwsh -NoProfile -File "scripts\$t.ps1"
            $code = $LASTEXITCODE
            Write-Host "::endgroup::"
            if ($code -ne 0) { Write-Host "::error::$t failed"; $failed += $t }
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }

      - name: Package
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "ci-$($env:GITHUB_SHA.Substring(0, 7))" }
          ./scripts/package-release.ps1 -Tag $tag

      - uses: actions/upload-artifact@v7
        with:
          name: pcdash-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  # Runs next to the build instead of after it.
  pcnet-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GO_VERSION: 1.27.1
    steps:
      - uses: actions/checkout@v5

      - name: Install Go
        run: ./scripts/install-go-toolchain.ps1 -Version $env:GO_VERSION

      - uses: actions/cache@v6
        with:
          path: |
            .cache/go-build
            .cache/go-mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('pcnet/go.sum') }}
          restore-keys: go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Go tests (pcnet)
        working-directory: pcnet
        run: |
          & "$env:GITHUB_WORKSPACE\tools\go$env:GO_VERSION\bin\go.exe" test ./...
          if ($LASTEXITCODE -ne 0) { throw "go test failed" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pcnet-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEYS: ${{ secrets.PCDASH_HOST_KEYSTORE_B64 != '' && secrets.PCDASH_REMOTE_KEYSTORE_B64 != '' }}
    steps:
      - name: Refuse to publish APKs signed with a throwaway key
        if: env.HAS_SIGNING_KEYS != 'true'
        run: |
          echo "::error::Set PCDASH_HOST_KEYSTORE_B64 and PCDASH_REMOTE_KEYSTORE_B64 (and PCDASH_KEYSTORE_PASSWORD if not 'android') before tagging a release."
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: pcdash-${{ github.sha }}
          path: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --title "PCDash ${TAG#v}" --generate-notes
          fi
